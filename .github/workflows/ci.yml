name: CI

on:
  push:
    branches: [main, master]
    # Tags are the release path. `bundle` only runs for a `v*` tag or a manual
    # dispatch, so this pattern is what makes that job reachable at all.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the real-desktop end-to-end job (needs a self-hosted Windows runner with two displays)"
        type: boolean
        default: false
      build_installers:
        description: "Build unsigned installers for manual smoke testing (not a release)"
        type: boolean
        default: false
      run_ui_audit:
        description: "Run the visual audit (needs a self-hosted Windows runner with an interactive desktop)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Format
        run: cargo fmt --all -- --check

      # `unfy-platform-win` links the `windows` crate and `unfy-desktop` links
      # Tauri's platform bindings, so neither compiles on a foreign host. The
      # workspace members are therefore checked where they are buildable; the
      # platform-neutral crates are checked everywhere.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        if: runner.os == 'Windows'

      - name: Clippy (platform-neutral crates)
        if: runner.os != 'Windows'
        run: >
          cargo clippy --locked --all-targets
          -p unfy-domain -p unfy-detect -p unfy-journal -p unfy-layout
          -p unfy-engine -p unfy-settings -p unfy-platform -p unfy-platform-mac
          -- -D warnings

      - name: Test
        run: cargo test --locked --workspace
        if: runner.os == 'Windows'

      - name: Test (platform-neutral crates)
        if: runner.os != 'Windows'
        run: >
          cargo test --locked
          -p unfy-domain -p unfy-detect -p unfy-journal -p unfy-layout
          -p unfy-engine -p unfy-settings -p unfy-platform -p unfy-platform-mac

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        working-directory: apps/desktop
        run: npm ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Build
        working-directory: apps/desktop
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist
          if-no-files-found: error

  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: [check, frontend]
    # Reachable from a `v*` tag (the release path) or a manual dispatch for smoke
    # testing. Branch pushes and pull requests skip it.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_installers)
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install
        working-directory: apps/desktop
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

      # The updater verifies a minisign signature on every downloaded package.
      # Without the private key `createUpdaterArtifacts` has nothing to sign, so a
      # tag build would publish a package no installed client can accept. A manual
      # dispatch may still produce an unsigned installer for smoke testing.
      - name: Require the updater signing key for a release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Refusing to publish: TAURI_SIGNING_PRIVATE_KEY is not set, so the"
            echo "updater packages would be unsigned and every installed client would"
            echo "reject them. Run 'npx tauri signer generate' and store the private key."
            exit 1
          fi

      # `secrets` cannot appear in a step-level `if`, so the check moves into the
      # script: an unset certificate means an unsigned build, which is a supported
      # state, not an error.
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output 'No Authenticode certificate configured; building unsigned.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'unfy-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          } finally { Remove-Item $certificatePath -Force }

      # tauri-action builds, signs the updater package, generates latest.json and
      # publishes the GitHub release. Reimplementing that here meant a hand-written
      # minisign verifier and a manifest assembler to maintain against upstream.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          # The frontend is built and uploaded by the `frontend` job; rebuilding it
          # here would discard that artifact and double the wall time. `--locked`
          # keeps Cargo.lock authoritative.
          args: >-
            ${{ matrix.args }}
            --config '{"build":{"beforeBuildCommand":""}}'
            -- --locked
          # Only a tag publishes. A manual dispatch builds and uploads a workflow
          # artifact so the installer can be checked without creating a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseDraft: "true"
          prerelease: "false"
          uploadUpdaterJson: "true"
          updaterJsonPreferNsis: "true"
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          workflowArtifactNamePattern: "unfy-[platform]-[arch]"

  publish:
    name: Publish release
    needs: [bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Both platform jobs write into the same draft release. Publishing only after
      # both finish is what makes a half-uploaded release impossible to download.
      - name: Publish the draft once every platform has uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  ui-audit:
    name: UI audit (real window)
    needs: [frontend]
    # Needs a real WebView2 window: contrast, layout and clipping cannot be judged
    # in a DOM shim, where every computed style is invented.
    #
    # `windows-latest` cannot host it. The app builds there, but the hosted runner
    # has no interactive desktop session, so WebView2 never creates a window and
    # the debugging port the audit connects to never opens. This is the same
    # constraint the e2e job documents; it applies to any job that needs a real
    # window. Enable with the manual `run_ui_audit` dispatch input once a
    # self-hosted Windows runner with an interactive session is registered.
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_audit
    runs-on: [self-hosted, windows, unfy-e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        working-directory: apps/desktop
        run: npm ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/desktop/dist

      - name: Build the app
        run: cargo build --locked -p unfy-desktop --features tauri/custom-protocol

      - name: Audit contrast, clipping and overflow
        run: bun scripts/ui-audit.mjs

  e2e-windows:
    name: End-to-end (real desktop)
    needs: [check]
    # Off by default. The suite drives real windows on a real desktop, so the
    # hosted `windows-latest` runner cannot run it: it has one virtual display and
    # no interactive session to move windows on. Enable it with the manual
    # `run_e2e` dispatch input once a runner with these properties is registered
    # under the `unfy-e2e` label:
    #
    #   * Windows 10/11 x64, registered as a self-hosted runner with labels
    #     `self-hosted`, `windows`, `x64`, `unfy-e2e`;
    #   * the runner service running in an *interactive* desktop session, not as a
    #     Session 0 service and not headless — `MoveWindow`/`ShowWindow` need a
    #     window station the desktop actually displays;
    #   * at least two physical or virtual displays attached and arranged as
    #     separate screens (one extended desktop, not a mirrored or single screen),
    #     because the suite moves windows between displays and back;
    #   * that session unlocked and not disconnected, since a locked or RDP
    #     disconnected session stops compositing and window geometry stops
    #     reflecting what a user sees;
    #   * the Rust toolchain plus MSVC build tools installed locally, as usual for
    #     a self-hosted runner.
    #
    # Without those, the job must stay disabled: a green run there would be a
    # statement about a desktop no user has.
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: [self-hosted, windows, x64, unfy-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo run --locked -p unfy-platform-win --bin e2e
