[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/detect",
    "crates/journal",
    "crates/layout",
    "crates/engine",
    "crates/settings",
    "crates/platform",
    "crates/platform/win",
    "crates/platform/mac",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
conflux-detect = { path = "crates/detect" }
conflux-domain = { path = "crates/domain" }
conflux-engine = { path = "crates/engine" }
conflux-journal = { path = "crates/journal" }
conflux-layout = { path = "crates/layout" }
conflux-settings = { path = "crates/settings" }
conflux-platform = { path = "crates/platform" }
conflux-platform-win = { path = "crates/platform/win" }
conflux-platform-mac = { path = "crates/platform/mac" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
