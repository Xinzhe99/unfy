[package]
name = "conflux-platform-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "macOS Accessibility backend for Conflux"

# Every dependency is macOS-only. On other hosts this crate compiles to an empty
# library so the workspace still builds and lints everywhere, while a contributor
# on Linux or Windows cannot accidentally link AppKit glue into a release.
[dependencies]
conflux-domain = { workspace = true }
conflux-platform = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
