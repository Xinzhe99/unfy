[package]
name = "conflux-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gather windows onto one display for remote sessions"

[lib]
name = "conflux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "conflux"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
conflux-domain = { workspace = true }
conflux-engine = { workspace = true }
conflux-journal = { workspace = true }
conflux-layout = { workspace = true }
conflux-platform = { workspace = true }
conflux-settings = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
conflux-platform-win = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
conflux-platform-mac = { workspace = true }
